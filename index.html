<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swimsuit Models</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f0f0f;
      color: #fff;
      min-height: 100vh;
      padding: 30px 20px 60px;
    }
    header {
      text-align: center;
      margin-bottom: 40px;
    }
    h1 {
      font-size: 2.4rem;
      font-weight: 300;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 1rem;
      opacity: 0.6;
      letter-spacing: 1px;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .card {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      background: #1a1a1a;
      aspect-ratio: 3 / 4;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }
    .card:hover img {
      transform: scale(1.05);
    }
    .caption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px 16px 16px;
      background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
      font-size: 0.95rem;
      letter-spacing: 0.5px;
    }
    footer {
      text-align: center;
      margin-top: 50px;
      font-size: 0.85rem;
      opacity: 0.5;
    }
    @media (max-width: 600px) {
      h1 { font-size: 1.8rem; }
      .gallery { gap: 16px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Swimsuit Models</h1>
    <p class="subtitle">Summer Collection</p>
  </header>

  <div class="gallery">
    <div class="card">
      <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=600&q=80" alt="Swimsuit model" loading="lazy">
      <div class="caption">Coastal Classic</div>
    </div>
    <div class="card">
      <img src="https://images.unsplash.com/photo-1506629082955-511b1aa1ec2a?w=600&q=80" alt="Swimsuit model" loading="lazy">
      <div class="caption">Sunset Beach</div>
    </div>
    <div class="card">
      <img src="https://images.unsplash.com/photo-1571019614242-c5c5dee9f50b?w=600&q=80" alt="Swimsuit model" loading="lazy">
      <div class="caption">Active Swim</div>
    </div>
    <div class="card">
      <img src="https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=600&q=80" alt="Swimsuit model" loading="lazy">
      <div class="caption">Ocean Breeze</div>
    </div>
    <div class="card">
      <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=600&q=80" alt="Swimsuit model" loading="lazy">
      <div class="caption">Tropical Glow</div>
    </div>
    <div class="card">
      <img src="https://images.unsplash.com/photo-1488426862026-3ee34a7d66df?w=600&q=80" alt="Swimsuit model" loading="lazy">
      <div class="caption">Golden Hour</div>
    </div>
  </div>

  <footer>
    Single-page gallery • Images from Unsplash
  </footer>
</body>
</html>
