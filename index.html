<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spanish Flashcards</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f5f5f7; margin:0; padding:20px; color:#1d1d1f; }
    .container { max-width: 620px; margin: 0 auto; }
    header { text-align:center; margin-bottom:20px; }
    h1 { color:#0071e3; font-size: 28px; }
    .tabs { display:flex; gap:10px; margin-bottom:15px; }
    .tab { padding:10px 20px; background:white; border-radius:12px; cursor:pointer; border:1px solid #d2d2d7; }
    .tab.active { background:#0071e3; color:white; }
    .controls { display:flex; gap:10px; margin-bottom:15px; flex-wrap:wrap; }
    input { flex:1; padding:12px; border-radius:12px; border:1px solid #d2d2d7; font-size:17px; }
    .card { background:white; border-radius:20px; height:420px; display:flex; align-items:center; justify-content:center; text-align:center; font-size:26px; cursor:pointer; box-shadow:0 10px 30px rgba(0,0,0,0.1); }
    .card-inner { position:relative; width:100%; height:100%; transition:transform 0.8s; transform-style:preserve-3d; }
    .card.flipped .card-inner { transform:rotateY(180deg); }
    .card-front, .card-back { position:absolute; width:100%; height:100%; backface-visibility:hidden; display:flex; align-items:center; justify-content:center; padding:30px; box-sizing:border-box; }
    .card-back { transform:rotateY(180deg); background:#0071e3; color:white; }
    .buttons { display:flex; justify-content:center; gap:12px; margin-top:20px; flex-wrap:wrap; }
    button { padding:14px 24px; font-size:17px; background:#0071e3; color:white; border:none; border-radius:12px; cursor:pointer; }
    .stats { text-align:center; margin:15px 0; font-size:16px; color:#555; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Spanish Flashcards</h1>
    </header>

    <div class="tabs">
      <div class="tab active" onclick="switchTab(0)">Main</div>
      <div class="tab" onclick="switchTab(1)">More Words</div>
    </div>

    <div class="controls">
      <input type="text" id="search" placeholder="Search...">
      <button onclick="shuffleCards()">Shuffle</button>
    </div>

    <div class="stats" id="stats">Card 1 of 0</div>

    <div class="card" id="card">
      <div class="card-inner" id="card-inner">
        <div class="card-front" id="front">Tap to start</div>
        <div class="card-back" id="back"></div>
      </div>
    </div>

    <div class="buttons">
      <button onclick="flipCard()">Flip Card</button>
      <button onclick="nextCard()">Next Card →</button>
    </div>
  </div>

  <script>
    let currentTab = 0;
    let currentIndex = 0;
    let isFlipped = false;

    const vocabMain = [
      ["¡Hola!", "Hello/Hi!"],
      ["Buenos días.", "Good morning."],
      ["Buenas tardes.", "Good afternoon."],
      ["Buenas noches.", "Goodnight."],
      ["Hasta luego.", "See you later."],
      ["¡Adiós!", "Bye!"],
      ["Gracias.", "Thank you."],
      ["Por favor.", "Please."],
      ["Lo siento.", "I'm sorry."],
      ["No entiendo.", "I don't understand."],
      ["¿Cuántos años tienes?", "How old are you?"],
      ["Tengo ... años.", "I'm ... years old."],
      ["el marido", "husband"],
      ["la mujer", "wife"],
      ["el hijo", "son"],
      ["la hija", "daughter"],
      ["el amigo / la amiga", "friend"]
    ];

    const vocabMore = [
      ["el tejado", "roof"],
      ["el balcón", "balcony"],
      ["la ventana", "window"],
      ["el edificio", "building"],
      ["el apartamento", "apartment"],
      ["el piso", "flat"],
      ["alquilar", "to rent"],
      ["vivir", "to live"],
      ["la habitación", "room"],
      ["el sótano", "cellar"],
      ["el techo", "ceiling"],
      ["la pared", "wall"],
      ["el suelo", "floor"],
      ["el enchufe", "plug"],
      ["la nevera", "fridge"],
      ["el horno", "oven"],
      ["la mesa", "table"],
      ["la silla", "chair"],
      ["el plato", "plate"],
      ["el vaso", "glass"],
      ["la ducha", "shower"],
      ["el váter", "toilet"],
      ["la cama", "bed"],
      ["el armario", "wardrobe"],
      ["el jardín", "garden"],
      ["el árbol", "tree"],
      ["la flor", "flower"],
      ["la carne", "meat"],
      ["el pescado", "fish"],
      ["la fruta", "fruit"],
      ["las verduras", "vegetables"],
      ["el queso", "cheese"],
      ["la leche", "milk"],
      ["el café", "coffee"],
      ["el té", "tea"],
      ["el camarero", "waiter"],
      ["vegetariano", "vegetarian"],
      ["el teléfono", "phone"],
      ["el correo electrónico", "email"],
      ["internet", "internet"],
      ["el ordenador", "computer"],
      ["el colegio", "school"],
      ["el maestro / la maestra", "teacher"],
      ["el alumno / la alumna", "student"],
      ["el banco", "bank"],
      ["el dinero", "money"],
      ["las vacaciones", "holiday"],
      ["el médico", "doctor"],
      ["el hospital", "hospital"],
      ["la medicina", "medicine"],
      ["el trabajo", "work"],
      ["la oficina", "office"],
      ["la reunión", "meeting"],
      ["el tren", "train"],
      ["el avión", "plane"],
      ["el aeropuerto", "airport"],
      ["la playa", "beach"],
      ["la música", "music"],
      ["el deporte", "sport"],
      ["el fútbol", "football"],
      ["el tenis", "tennis"],
      ["nadar", "to swim"],
      ["el perro", "dog"],
      ["el gato", "cat"],
      ["la montaña", "mountain"],
      ["el mar", "sea"],
      ["el cumpleaños", "birthday"],
      ["la fiesta", "party"],
      ["la Navidad", "Christmas"],
      ["el conductor", "driver"],
      ["el mapa", "map"],
      ["el billete", "ticket"],
      ["la estación", "station"],
      ["el supermercado", "supermarket"],
      ["comprar", "to buy"],
      ["pagar", "to pay"],
      ["la panadería", "bakery"],
      ["la carnicería", "butcher"],
      ["la pescadería", "fishmonger"],
      ["el arroz", "rice"],
      ["el pollo", "chicken"],
      ["el agua", "water"],
      ["el vino", "wine"],
      ["la cerveza", "beer"],
      ["el ingeniero", "engineer"],
      ["el dentista", "dentist"],
      ["el profesor", "professor"],
      ["la hora", "time"],
      ["el lunes", "Monday"],
      ["enero", "January"],
      ["la primavera", "spring"],
      ["el verano", "summer"],
      ["Hace sol.", "It's sunny."],
      ["Llueve.", "It's raining."],
      ["Hace calor.", "It's hot."],
      ["el autobús", "bus"],
      ["el hotel", "hotel"],
      ["la llave", "key"],
      ["el restaurante", "restaurant"],
      ["la cuenta", "the bill"],
      ["el farmacéutico", "pharmacist"],
      ["la receta", "prescription"],
      ["la farmacia", "pharmacy"],
      ["el dolor de cabeza", "headache"],
      ["el dolor de estómago", "stomachache"],
      ["la tirita", "plaster"],
      ["el jabón", "soap"],
      ["el champú", "shampoo"],
      ["la toalla", "towel"],
      ["el cepillo de dientes", "toothbrush"],
      ["el dentífrico", "toothpaste"]
    ];

    let currentVocab = vocabMain;

    const card = document.getElementById('card');
    const front = document.getElementById('front');
    const back = document.getElementById('back');

    function showCard() {
      const [spanish, english] = currentVocab[currentIndex];
      front.textContent = spanish;
      back.textContent = english;
      card.classList.remove('flipped');
      isFlipped = false;
      updateStats();
    }

    function flipCard() {
      card.classList.toggle('flipped');
      isFlipped = !isFlipped;
    }

    function nextCard() {
      currentIndex = (currentIndex + 1) % currentVocab.length;
      showCard();
    }

    function shuffleCards() {
      for (let i = currentVocab.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [currentVocab[i], currentVocab[j]] = [currentVocab[j], currentVocab[i]];
      }
      currentIndex = 0;
      showCard();
    }

    function updateStats() {
      document.getElementById('stats').textContent = `${currentIndex + 1} / ${currentVocab.length}`;
    }

    function switchTab(tab) {
      currentTab = tab;
      currentVocab = tab === 0 ? vocabMain : vocabMore;
      document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === tab));
      currentIndex = 0;
      showCard();
    }

    document.getElementById('search').addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase().trim();
      if (!term) return;
      const filtered = currentVocab.filter(([es, en]) => 
        es.toLowerCase().includes(term) || en.toLowerCase().includes(term)
      );
      if (filtered.length > 0) {
        currentVocab = filtered;
        currentIndex = 0;
        showCard();
      }
    });

    card.addEventListener('click', flipCard);
    document.addEventListener('keydown', e => {
      if (e.key === " " || e.key === "Enter") flipCard();
      if (e.key === "ArrowRight") nextCard();
    });

    showCard();
  </script>
</body>
</html>
