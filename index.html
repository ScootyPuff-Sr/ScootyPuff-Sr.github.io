<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spanish Flashcards</title>
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
      background: #f4f0e8; /* Soft warm beige - very easy on eyes */
      margin:0; 
      padding:20px; 
      color:#2c2c2c; 
    }
    .container { max-width: 620px; margin: 0 auto; }
    header { text-align:center; margin-bottom:20px; }
    h1 { color:#2a6d5e; font-size: 28px; } /* Deep teal */
    
    .tabs { display:flex; gap:10px; margin-bottom:15px; }
    .tab { 
      padding:10px 20px; 
      background:white; 
      border-radius:12px; 
      cursor:pointer; 
      border:1px solid #d2d2d7; 
    }
    .tab.active { 
      background:#2a6d5e; 
      color:white; 
    }

    .controls { display:flex; gap:10px; margin-bottom:15px; flex-wrap:wrap; }
    input { 
      flex:1; 
      padding:12px; 
      border-radius:12px; 
      border:1px solid #d2d2d7; 
      font-size:17px; 
      background: #faf8f2;
    }

    .card { 
      background:#faf8f2; /* Very soft warm white */
      border-radius:20px; 
      height:420px; 
      display:flex; 
      align-items:center; 
      justify-content:center; 
      text-align:center; 
      font-size:26px; 
      cursor:pointer; 
      box-shadow:0 10px 30px rgba(0,0,0,0.08); 
    }
    .card-inner { position:relative; width:100%; height:100%; transition:transform 0.8s; transform-style:preserve-3d; }
    .card.flipped .card-inner { transform:rotateY(180deg); }
    .card-front, .card-back { 
      position:absolute; 
      width:100%; 
      height:100%; 
      backface-visibility:hidden; 
      display:flex; 
      align-items:center; 
      justify-content:center; 
      padding:30px; 
      box-sizing:border-box; 
    }
    .card-back { 
      transform:rotateY(180deg); 
      background:#2a6d5e; /* Calm deep teal */
      color:white; 
    }

    .buttons { display:flex; justify-content:center; gap:12px; margin-top:20px; flex-wrap:wrap; }
    button { 
      padding:14px 24px; 
      font-size:17px; 
      background:#2a6d5e; 
      color:white; 
      border:none; 
      border-radius:12px; 
      cursor:pointer; 
    }
    button:active { background:#1f5246; }

    .stats { text-align:center; margin:15px 0; font-size:16px; color:#555; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Spanish Flashcards</h1>
    </header>

    <div class="tabs">
      <div class="tab active" onclick="switchTab(0)">Main</div>
      <div class="tab" onclick="switchTab(1)">More Words</div>
    </div>

    <div class="controls">
      <input type="text" id="search" placeholder="Search...">
      <button onclick="shuffleCards()">Shuffle</button>
    </div>

    <div class="stats" id="stats">Card 1 of 0</div>

    <div class="card" id="card">
      <div class="card-inner" id="card-inner">
        <div class="card-front" id="front">Tap to start</div>
        <div class="card-back" id="back"></div>
      </div>
    </div>

    <div class="buttons">
      <button onclick="flipCard()">Flip Card</button>
      <button onclick="nextCard()">Next Card →</button>
    </div>
  </div>

  <script>
    // (Same script as before - vocab arrays unchanged)
    let currentTab = 0;
    let currentIndex = 0;
    let isFlipped = false;

    const vocabMain = [ /* ... same as last version ... */ ];
    const vocabMore = [ /* ... same large list ... */ ];

    let currentVocab = vocabMain;

    const card = document.getElementById('card');
    const front = document.getElementById('front');
    const back = document.getElementById('back');

    function showCard() {
      const [spanish, english] = currentVocab[currentIndex];
      front.textContent = spanish;
      back.textContent = english;
      card.classList.remove('flipped');
      isFlipped = false;
      updateStats();
    }

    function flipCard() {
      card.classList.toggle('flipped');
      isFlipped = !isFlipped;
    }

    function nextCard() {
      currentIndex = (currentIndex + 1) % currentVocab.length;
      showCard();
    }

    function shuffleCards() {
      for (let i = currentVocab.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [currentVocab[i], currentVocab[j]] = [currentVocab[j], currentVocab[i]];
      }
      currentIndex = 0;
      showCard();
    }

    function updateStats() {
      document.getElementById('stats').textContent = `${currentIndex + 1} / ${currentVocab.length}`;
    }

    function switchTab(tab) {
      currentTab = tab;
      currentVocab = tab === 0 ? vocabMain : vocabMore;
      document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === tab));
      currentIndex = 0;
      showCard();
    }

    document.getElementById('search').addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase().trim();
      if (!term) return;
      const filtered = currentVocab.filter(([es, en]) => 
        es.toLowerCase().includes(term) || en.toLowerCase().includes(term)
      );
      if (filtered.length > 0) {
        currentVocab = filtered;
        currentIndex = 0;
        showCard();
      }
    });

    card.addEventListener('click', flipCard);
    document.addEventListener('keydown', e => {
      if (e.key === " " || e.key === "Enter") flipCard();
      if (e.key === "ArrowRight") nextCard();
    });

    showCard();
  </script>
</body>
</html>
